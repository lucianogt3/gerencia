{% extends "base.html" %}

{% block content %}
<div class="nursing-monthly">
    <div class="page-head">
        <div class="page-head-left">
            <h1>Escala Diária</h1>
            <div class="muted">
                <span class="status-dot active"></span> {{ current_date.strftime('%d/%m/%Y') }}
            </div>
        </div>
        <div class="head-actions">
            <button class="btn small"><i class="icon-calendar"></i> Outro Dia</button>
            <button class="btn small secondary"><i class="icon-print"></i> Imprimir</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head">
            <h2>Plantão do Dia</h2>
            <div class="muted">Distribuição por setor</div>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Colaborador</th>
                        <th>Setor</th>
                        <th>Turno</th>
                        <th>Horário</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Exemplo Colaborador</td>
                        <td>UTI</td>
                        <td><span class="badge badge-active">Diurno</span></td>
                        <td>07:00 - 19:00</td>
                        <td><span class="status-dot active"></span> Presente</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
